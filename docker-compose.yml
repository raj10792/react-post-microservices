services:
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    volumes:
      - kafka_data_v39:/var/lib/kafka/data

  user-service:
    build:
      context: ./user_service
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-daybook-local-secret-key-base-replace-before-deploy-7e3d}
      JWT_SECRET: ${JWT_SECRET:-daybook-local-jwt-secret-replace-before-deploy-9851}
      KAFKA_BROKERS: kafka:9092
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "3001:80"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - user_data:/rails/storage
    restart: unless-stopped

  post-service:
    build:
      context: ./post_service
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-daybook-local-secret-key-base-replace-before-deploy-7e3d}
      JWT_SECRET: ${JWT_SECRET:-daybook-local-jwt-secret-replace-before-deploy-9851}
      KAFKA_BROKERS: kafka:9092
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "3002:80"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - post_data:/rails/storage
    restart: unless-stopped

  event-consumer:
    build:
      context: ./post_service
    command: ["./bin/rails", "events:consume"]
    environment:
      RAILS_ENV: production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:-daybook-local-secret-key-base-replace-before-deploy-7e3d}
      JWT_SECRET: ${JWT_SECRET:-daybook-local-jwt-secret-replace-before-deploy-9851}
      KAFKA_BROKERS: kafka:9092
      KAFKA_GROUP_ID: post-service
    depends_on:
      kafka:
        condition: service_healthy
      post-service:
        condition: service_healthy
    volumes:
      - post_data:/rails/storage
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_USER_API_URL: /api/users
        REACT_APP_POST_API_URL: /api/posts
    ports:
      - "3000:80"
    depends_on:
      user-service:
        condition: service_healthy
      post-service:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka_data_v39:
  user_data:
  post_data:
